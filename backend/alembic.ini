# Production (Postgres) schema changes are managed here. Local SQLite/tests use create_all in main.py.
# Usage: cd backend && alembic upgrade head   (applies to the DB in DATABASE_URL)
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
